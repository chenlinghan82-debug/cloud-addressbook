<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云通讯录 · Cloud Address Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
    <div class="page">
        <header class="hero">
            <div class="hero-inner">
                <div class="logo">📖</div>
                <div>
                    <h1>云通讯录 <span class="hero-en">Cloud Address Book</span></h1>
                    <p class="hero-sub">收藏常联的人，管理多重的联系方式，一键导入导出 Excel</p>
                </div>
            </div>
            <div class="toolbar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input id="searchInput" type="text" placeholder="搜索姓名、电话、邮箱、地址…">
                </div>
                <div class="toolbar-actions">
                    <button id="btnAdd" class="btn btn-primary">＋ 新建联系人</button>
                    <button id="btnExport" class="btn btn-ghost" title="导出为 Excel">⬇ 导出 Excel</button>
                    <button id="btnImport" class="btn btn-ghost" title="从 Excel 导入">⬆ 导入 Excel</button>
                    <input id="importFile" type="file" accept=".xlsx,.xlsm" hidden>
                </div>
            </div>
        </header>

        <section id="favSection" class="fav-section" hidden>
            <h2 class="section-title">⭐ 常用联系人</h2>
            <div id="favGrid" class="fav-grid"></div>
        </section>

        <section class="list-section">
            <h2 class="section-title">全部联系人 <span id="contactCount" class="count-badge">0</span></h2>
            <div id="contactGrid" class="contact-grid"></div>
            <div id="emptyState" class="empty" hidden>
                <div class="empty-icon">🗂️</div>
                <p>还没有联系人，点击右上角「新建联系人」开始吧</p>
            </div>
        </section>
    </div>

    <!-- 新建/编辑联系人弹窗 -->
    <div id="modalMask" class="modal-mask" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
                <h3 id="modalTitle">新建联系人</h3>
                <button class="icon-btn" id="btnCloseModal" title="关闭">✕</button>
            </div>
            <form id="contactForm">
                <div class="form-row">
                    <label>姓名 <b class="req">*</b></label>
                    <input id="fName" type="text" required placeholder="联系人姓名">
                </div>
                <div class="form-row">
                    <label>备注</label>
                    <input id="fNotes" type="text" placeholder="关系、公司、备忘…">
                </div>
                <div id="detailRows"></div>
                <div class="detail-adder">
                    <span>添加联系方式：</span>
                    <button type="button" class="chip" data-add-type="phone">＋ 电话</button>
                    <button type="button" class="chip" data-add-type="email">＋ 邮箱</button>
                    <button type="button" class="chip" data-add-type="social">＋ 社交媒体</button>
                    <button type="button" class="chip" data-add-type="address">＋ 地址</button>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
                    <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastBox" class="toast-box"></div>
    <footer class="footer">Software Engineering (FZU–MU) · Extreme Programming Assignment · 云通讯录 v1.0</footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
